<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mealboard</title>
  <meta name="description" content="Weekly meal plan and grocery list">
  <meta name="theme-color" content="#F3F6F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mealboard">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="week-nav">
      <button class="icon-btn" data-action="prev-week" aria-label="Previous week">‹</button>
      <h1 id="week-title">Week</h1>
      <button class="icon-btn" data-action="next-week" aria-label="Next week">›</button>
    </div>
    <button class="icon-btn" data-action="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.6 4.9-.1-1.4 1.9-1.5-1.9-3.3-2.3.8a7.6 7.6 0 0 0-2.4-1.4L15.4 4h-3.8l-.4 2.6c-.9.3-1.7.8-2.4 1.4l-2.3-.8-1.9 3.3 1.9 1.5a7 7 0 0 0 0 2.8l-1.9 1.5 1.9 3.3 2.3-.8c.7.6 1.5 1.1 2.4 1.4l.4 2.6h3.8l.4-2.6c.9-.3 1.7-.8 2.4-1.4l2.3.8 1.9-3.3-1.9-1.5.1-1.4Z"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="plan">Plan</button>
    <button class="tab" data-tab="groceries">Groceries</button>
    <button class="tab" data-tab="meals">Meals</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
